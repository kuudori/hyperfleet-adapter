schema_version: "2.0"

# This example manages clusters. For another kind, change the /clusters/ API
# paths and the hyperfleet.io/cluster-* labels together with the matching
# label_selector; resourceId is the event's resource ID.
params:
  - name: "resourceId"
    source: "event.id"
    type: "string"
    required: true

  - name: checkResourceState
    source:
      api_call:
        method: "GET"
        url: "/clusters/{{ .resourceId }}"
        timeout: 10s

  - name: generation
    source: checkResourceState.generation
    type: int

  - name: resourceName
    source: checkResourceState.name

  - name: is_deleting
    source:
      expression: "checkResourceState.?deleted_time.hasValue()"

resources:
  - name: namespace
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ .resourceId }}-k8s"
        labels:
          hyperfleet.io/cluster-id: "{{ .resourceId }}"
          hyperfleet.io/cluster-name: "{{ .resourceName }}"
          hyperfleet.io/managed-by: "{{ .adapter.name }}"
          hyperfleet.io/resource-type: "namespace"
        annotations:
          hyperfleet.io/created-by: "hyperfleet-adapter"
          hyperfleet.io/generation: "{{ .generation }}"
    discovery:
      by_name: '{{ .resourceId }}-k8s'
    lifecycle:
      delete:
        propagationPolicy: Background
        when:
          expression: "is_deleting"
  - name: "helloWorldJob"
    manifest:
      ref: "job.yaml"
    discovery:
      namespace: '{{ .resourceId }}-k8s'
      by_selectors:
        label_selector:
          hyperfleet.io/resource-type: "job"
          hyperfleet.io/cluster-id: "{{ .resourceId }}"
    lifecycle:
      delete:
        propagationPolicy: Background
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: "resourceStatusPayload"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          # Applied: job manifest was successfully applied
          - type: "Applied"
            status:
              expression: |
                has(resources.helloWorldJob) ? "True" : "False"
            reason:
              expression: |
                has(resources.helloWorldJob) ? "JobApplied" : "JobPending"
            message:
              expression: |
                has(resources.helloWorldJob)
                  ? "Hello-world job applied successfully"
                  : "Hello-world job is pending"
          # Available: True when the job has completed successfully
          - type: "Available"
            status:
              expression: |
                has(resources.helloWorldJob) ?
                  ( resources.?helloWorldJob.?status.?conditions.orValue([]).exists(c, c.type == "Complete")
                    ? resources.helloWorldJob.status.conditions.filter(c, c.type == "Complete")[0].status
                    : "False")
                  : "False"
            reason:
              expression: |
                resources.?helloWorldJob.?status.?conditions.orValue([]).exists(c, c.type == "Complete")
                  ? "JobComplete"
                  : resources.?helloWorldJob.?status.?conditions.orValue([]).exists(c, c.type == "Failed")
                    ? "JobFailed"
                    : resources.?helloWorldJob.?status.hasValue()
                      ? "JobRunning"
                      : "JobPending"
            message:
              expression: |
                resources.?helloWorldJob.?status.?conditions.orValue([]).exists(c, c.type == "Complete")
                  ? "Hello-world job completed successfully"
                  : resources.?helloWorldJob.?status.?conditions.orValue([]).exists(c, c.type == "Failed")
                    ? "Hello-world job failed"
                    : resources.?helloWorldJob.?status.hasValue()
                      ? "Hello-world job is running"
                      : "Hello-world job is pending"
          # Health: Adapter execution status (runtime)
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                ? "True"
                : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                : adapter.?resourcesSkipped.orValue(false)
                  ? "ResourcesSkipped"
                  : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                ? "Adapter failed at phase ["
                    + adapter.?executionError.?phase.orValue("unknown")
                    + "] step ["
                    + adapter.?executionError.?step.orValue("unknown")
                    + "]: "
                    + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                : adapter.?resourcesSkipped.orValue(false)
                  ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                  : "Adapter execution completed successfully"
          # Finalized: True once the namespace is confirmed deleted during a deletion event
          - type: "Finalized"
            status:
              expression: |
                is_deleting
                  && adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  && resource_states.?namespace.orValue("") == "confirmed_deleted"
                  && resource_states.?helloWorldJob.orValue("") == "confirmed_deleted"
                ? "True"
                : "False"
            reason:
              expression: |
                !is_deleting
                ? ""
                : adapter.?executionStatus.orValue("") != "success"
                  ? "AdapterUnhealthy"
                  : resource_states.?namespace.orValue("") == "confirmed_deleted"
                      && resource_states.?helloWorldJob.orValue("") == "confirmed_deleted"
                    ? "CleanupConfirmed"
                    : "CleanupInProgress"
            message:
              expression: |
                !is_deleting
                ? ""
                : adapter.?executionStatus.orValue("") != "success"
                  ? "Cannot confirm cleanup while the adapter is unhealthy"
                  : resource_states.?namespace.orValue("") == "confirmed_deleted"
                      && resource_states.?helloWorldJob.orValue("") == "confirmed_deleted"
                    ? "All resources deleted; cleanup confirmed"
                    : "Deletion in progress; waiting for Job and Namespace confirmation"
        observed_generation:
          expression: "generation"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"

  post_actions:
    - name: "reportResourceStatus"
      api_call:
        method: "PUT"
        url: "/clusters/{{ .resourceId }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .resourceStatusPayload }}"
